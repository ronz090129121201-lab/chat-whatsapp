<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security Dashboard</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px;background:#02070d;
 color:#eafff7;font-family:Arial,sans-serif
}
.container{
 max-width:440px;margin:20px auto;padding:20px;
 background:#081722;border:1px solid #00c982;
 border-radius:18px;
 box-shadow:0 0 25px #00ff8840;
}
h1{text-align:center;color:#00ff9d;letter-spacing:3px}
h2{font-size:16px;color:#00ff9d}
.small{text-align:center;color:#7fa99b;font-size:12px}
.card{
 background:#102a32;padding:15px;margin:12px 0;
 border-radius:10px;border:1px solid #174a43
}
.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.number{font-size:25px;color:#00ff9d;font-weight:bold;margin:8px 0}
.bar{height:7px;background:#18352e;border-radius:10px;overflow:hidden}
.fill{height:100%;width:0;background:#00ff9d;transition:width .4s}
.tabs{display:flex;gap:8px;margin:18px 0}
button{
 border:0;border-radius:8px;padding:13px;
 font-weight:bold;cursor:pointer
}
.tabs button{flex:1;background:#18352e;color:white}
.tabs button.active{background:#00e890;color:#001b12}
.item{
 display:flex;align-items:center;gap:10px;
 padding:13px;margin:9px 0;background:#102a32;
 border-radius:9px
}
input{width:20px;height:20px;accent-color:#00ff9d}
.start{
 width:100%;margin-top:12px;
 background:#00e890;color:#001b12
}
#status{
 margin-top:15px;padding:14px;text-align:center;
 background:#06120f;border:1px solid #176b54;
 border-radius:9px;line-height:1.7
}
#scan{
 display:none;text-align:center;color:#00ff9d;
 margin:18px 0;animation:blink .5s infinite alternate
}
.scanline{
 height:4px;background:#00ff9d;
 box-shadow:0 0 15px #00ff9d;
 margin-top:12px;display:none;
 animation:move 1s infinite alternate
}
@keyframes blink{
 from{opacity:.3}
 to{opacity:1;text-shadow:0 0 12px #00ff9d}
}
@keyframes move{
 from{transform:scaleX(.2)}
 to{transform:scaleX(1)}
}
</style>
</head>
<body>
<div class="container">

<h1>SECURITY DASHBOARD</h1>
<p class="small">LOCAL SECURITY REVIEW</p>

<h2>DASHBOARD UTAMA</h2>

<div class="dashboard">
 <div class="card">
  PROFIL 1
  <div class="number" id="count1">0/5</div>
  <div class="bar"><div class="fill" id="bar1"></div></div>
 </div>
 <div class="card">
  PROFIL 2
  <div class="number" id="count2">0/5</div>
  <div class="bar"><div class="fill" id="bar2"></div></div>
 </div>
</div>

<div class="card">
 JUMLAH KESELURUHAN
 <div class="number" id="total">0/10</div>
 <div id="overall">BELUM LENGKAP</div>
</div>

<div class="tabs">
 <button id="tab1" class="active" onclick="pilih(1)">PROFIL 1</button>
 <button id="tab2" onclick="pilih(2)">PROFIL 2</button>
</div>

<h2 id="title">SEMAKAN PROFIL 1</h2>
<div id="checks"></div>

<button class="start" onclick="semak()">MULA IMBASAN</button>

<div id="scan">
 SEDANG MENJALANKAN IMBASAN...
 <div class="scanline" id="scanline"></div>
</div>

<div class="bar" style="margin-top:15px">
 <div class="fill" id="progress"></div>
</div>

<div id="status">MENUNGGU SEMAKAN</div>

<p class="small">
Simulasi visual dan panduan keselamatan sahaja.
Tidak mengakses WhatsApp atau membaca mesej.
</p>
</div>

<script>
const perkara=[
 "Pengesahan dua langkah diaktifkan.",
 "Peranti dipautkan diperiksa.",
 "Telefon mempunyai kunci skrin.",
 "E-mel pemulihan dilindungi.",
 "Kod OTP tidak dikongsi."
];

let aktif=1;
let sedang=false;
let data={1:Array(5).fill(false),2:Array(5).fill(false)};

try{
 const saved=JSON.parse(localStorage.getItem("securityData"));
 if(saved && saved[1] && saved[2])data=saved;
}catch(e){}

function simpan(){
 localStorage.setItem("securityData",JSON.stringify(data));
}

function jumlah(n){
 return data[n].filter(Boolean).length;
}

function dashboard(){
 [1,2].forEach(n=>{
  document.getElementById("count"+n).textContent=jumlah(n)+"/5";
  document.getElementById("bar"+n).style.width=(jumlah(n)*20)+"%";
 });
 let total=jumlah(1)+jumlah(2);
 document.getElementById("total").textContent=total+"/10";
 document.getElementById("overall").textContent=
 total===10?"SEMUA SEMAKAN LENGKAP":"SEMAKAN BELUM LENGKAP";
}

function papar(){
 document.getElementById("title").textContent="SEMAKAN PROFIL "+aktif;
 document.getElementById("tab1").className=aktif===1?"active":"";
 document.getElementById("tab2").className=aktif===2?"active":"";

 document.getElementById("checks").innerHTML=perkara.map((p,i)=>
 `<div class="item">
 <input type="checkbox" ${data[aktif][i]?"checked":""}
 onchange="ubah(${i},this.checked)">
 <span>${p}</span>
 </div>`).join("");

 document.getElementById("status").textContent="MENUNGGU SEMAKAN";
 document.getElementById("progress").style.width="0%";
}

function ubah(i,value){
 data[aktif][i]=value;
 simpan();
 dashboard();
}

function pilih(n){
 if(sedang)return;
 aktif=n;
 papar();
}

function semak(){
 if(sedang)return;
 sedang=true;

 let j=jumlah(aktif);
 let p=0;

 const scan=document.getElementById("scan");
 const line=document.getElementById("scanline");
 const progress=document.getElementById("progress");
 const status=document.getElementById("status");

 scan.style.display="block";
 line.style.display="block";
 status.textContent="IMBASAN SEDANG BERJALAN...";

 const timer=setInterval(()=>{
  p+=5;
  progress.style.width=p+"%";

  if(p>=100){
   clearInterval(timer);
   sedang=false;
   scan.style.display="none";
   line.style.display="none";

   status.innerHTML=j===5
   ?"✓ PROFIL "+aktif+" SELESAI<br>5/5 DIPERIKSA"
   :"PROFIL "+aktif+" BELUM LENGKAP<br>"+j+"/5 DIPERIKSA";
  }
 },100);
}

papar();
dashboard();
</script>
</body>
</html>
